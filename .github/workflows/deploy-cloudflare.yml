name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "functions/**"
      - "games/**"
      - "scripts/**"
      # 运行时变量同步脚本改动也要触发：否则改了同步逻辑却不会重新部署+同步
      - "server-games/scripts/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # ------------------------------------------------------------------
      # 把公开的运行时地址从 GitHub Variables 同步到 Pages 项目。
      # 必须在 deploy 之前：Pages 的运行时变量是在部署时快照进该次部署的，
      # 部署之后再改，对已经上线的版本不生效。
      # 只动这三个键，其它已有变量原样保留。
      # ------------------------------------------------------------------
      - name: Sync runtime configuration to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: yuqing-game-hall
          FRUIT_PARTY_SERVICE_URL: ${{ vars.FRUIT_PARTY_SERVICE_URL }}
          SANCTUARY_RELAY_URL: ${{ vars.SANCTUARY_RELAY_URL }}
          WEBRTC_SERVICE_URL: ${{ vars.WEBRTC_SERVICE_URL }}
        run: node server-games/scripts/sync-pages-config.mjs

      - name: Test the runtime configuration sync
        run: node --test server-games/scripts/sync-pages-config.test.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=yuqing-game-hall
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
