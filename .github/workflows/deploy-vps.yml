name: Deploy VPS Backends

on:
  push:
    branches: [main]
    paths:
      - "server-games/**"
      - "games/fruit-party/src/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

concurrency:
  group: vps-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare image names
        id: vars
        shell: bash
        run: |
          repo_lc="${GITHUB_REPOSITORY,,}"
          echo "fruit_image=ghcr.io/${repo_lc}-fruit-party:latest" >> "$GITHUB_OUTPUT"
          echo "sanctuary_image=ghcr.io/${repo_lc}-sanctuary-relay:latest" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Fruit Party server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-games/fruit-party/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.fruit_image }}
          cache-from: type=gha,scope=fruit-party
          cache-to: type=gha,mode=max,scope=fruit-party

      - name: Build and push Sanctuary relay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-games/sanctuarys-end/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.sanctuary_image }}
          cache-from: type=gha,scope=sanctuary-relay
          cache-to: type=gha,mode=max,scope=sanctuary-relay

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload production compose file
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp server-games/docker-compose.prod.yml \
            "${VPS_USER}@${VPS_HOST}:/opt/yuqing-game-hall/server-games/docker-compose.prod.yml"

      - name: Login VPS to GHCR
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        shell: bash
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | \
            ssh "${VPS_USER}@${VPS_HOST}" \
            "docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin"

      - name: Pull and restart backends
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          FRUIT_IMAGE: ${{ steps.vars.outputs.fruit_image }}
          SANCTUARY_IMAGE: ${{ steps.vars.outputs.sanctuary_image }}
        shell: bash
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" \
            "cd /opt/yuqing-game-hall/server-games && \
             FRUIT_PARTY_IMAGE='${FRUIT_IMAGE}' \
             SANCTUARY_RELAY_IMAGE='${SANCTUARY_IMAGE}' \
             docker compose --env-file .env -f docker-compose.prod.yml pull && \
             FRUIT_PARTY_IMAGE='${FRUIT_IMAGE}' \
             SANCTUARY_RELAY_IMAGE='${SANCTUARY_IMAGE}' \
             docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans && \
             docker image prune -f"

      - name: Verify backend health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" \
            "curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://127.0.0.1:8790/api/health && \
             curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://127.0.0.1:8787/health"
