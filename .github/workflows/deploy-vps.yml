name: Deploy VPS Backends

# 部署配置的唯一来源是 GitHub：
#   - 非敏感项 -> Settings → Secrets and variables → Actions → Variables
#   - 敏感项   -> 同一页面的 Secrets
# 每次运行都会重新生成 server-games 的生产 .env 并原子替换到 VPS，
# 不需要（也不应该）长期手动维护 /opt/yuqing-game-hall/server-games/.env。
#
# 注意：修改 Variables / Secrets 不会触发 push 事件，改完配置后请到 Actions
# 页面手动 Run workflow，或者推一个任意提交。

on:
  push:
    branches: [main]
    paths:
      - "server-games/**"
      # 文档修改不需要重启正在进行的香港对局。
      - "!server-games/README.md"
      - "games/fruit-party/src/shared/**"
      - "public/games/littlejs-arcade/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      # 修改部署工作流本身也不应自动重启线上服务器。
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "部署目标：香港沿用现有仓库配置；马来西亚读取 malaysia 环境配置"
        required: true
        type: choice
        options:
          - hongkong
          - malaysia
        default: hongkong
      image_sha:
        description: "留空部署当前提交；填 40 位提交号可回滚到已保留的镜像版本"
        required: false
        type: string
        default: ""

concurrency:
  group: vps-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'hongkong' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # push 默认继续部署香港；仅手动选择 malaysia 才使用独立环境配置。
    # GitHub 同名环境 Secret/Variable 优先于仓库级配置；malaysia 有额外防误部署校验。
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'malaysia' && 'malaysia' || 'hongkong' }}

    steps:
      - name: Verify selected deployment environment
        shell: bash
        env:
          DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'hongkong' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TURN_EXTERNAL_IP: ${{ vars.TURN_EXTERNAL_IP }}
          MALAYSIA_PUBLIC_IP: ${{ vars.MALAYSIA_PUBLIC_IP }}
          DEPLOY_TARGET_GUARD: ${{ vars.DEPLOY_TARGET_GUARD }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_SSH_KEY" ]]; then
            echo "::error::缺少 VPS_HOST、VPS_USER 或 VPS_SSH_KEY，停止部署。"
            exit 1
          fi
          case "$DEPLOY_TARGET" in
            malaysia)
              # 防止 malaysia 环境缺少私有配置时，悄悄回退到香港仓库级 Secrets。
              if [[ "$DEPLOY_TARGET_GUARD" != "malaysia" || -z "$MALAYSIA_PUBLIC_IP" ]]; then
                echo "::error::malaysia 环境缺少 DEPLOY_TARGET_GUARD=malaysia 或 MALAYSIA_PUBLIC_IP，停止部署。"
                exit 1
              fi
              if [[ "$VPS_HOST" != "$MALAYSIA_PUBLIC_IP" || "$TURN_EXTERNAL_IP" != "$MALAYSIA_PUBLIC_IP" ]]; then
                echo "::error::malaysia 的 VPS_HOST、TURN_EXTERNAL_IP 必须与 MALAYSIA_PUBLIC_IP 一致，拒绝部署到错误服务器。"
                exit 1
              fi
              ;;
            hongkong) ;;
            *)
              echo "::error::未知部署目标，停止部署。"
              exit 1
              ;;
          esac
          echo "部署目标配置校验通过：$DEPLOY_TARGET"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.24.0"

      # 正常部署构建当前提交；手动填写 image_sha 时只拉取既有镜像，用于回滚。
      - name: Prepare image names
        id: vars
        shell: bash
        env:
          IMAGE_SHA_INPUT: ${{ inputs.image_sha }}
        run: |
          if [[ -n "$IMAGE_SHA_INPUT" ]]; then
            if [[ ! "$IMAGE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::image_sha 必须是 40 位小写 Git 提交号。"
              exit 1
            fi
            image_sha="$IMAGE_SHA_INPUT"
            echo "rollback=true" >> "$GITHUB_OUTPUT"
          else
            image_sha="$GITHUB_SHA"
            echo "rollback=false" >> "$GITHUB_OUTPUT"
          fi

          repo_lc="${GITHUB_REPOSITORY,,}"
          echo "image_sha=${image_sha}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=ghcr.io/${repo_lc}" >> "$GITHUB_OUTPUT"
          echo "fruit_image=ghcr.io/${repo_lc}-fruit-party:${image_sha}" >> "$GITHUB_OUTPUT"
          echo "sanctuary_image=ghcr.io/${repo_lc}-sanctuary-relay:${image_sha}" >> "$GITHUB_OUTPUT"
          echo "webrtc_image=ghcr.io/${repo_lc}-webrtc-gateway:${image_sha}" >> "$GITHUB_OUTPUT"
          echo "card_image=ghcr.io/${repo_lc}-card-room:${image_sha}" >> "$GITHUB_OUTPUT"
          echo "gobang_image=ghcr.io/${repo_lc}-gobang:${image_sha}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        if: steps.vars.outputs.rollback != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Fruit Party server
        if: steps.vars.outputs.rollback != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-games/fruit-party/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.fruit_image }}
          cache-from: type=gha,scope=fruit-party
          cache-to: type=gha,mode=max,scope=fruit-party

      - name: Build and push Sanctuary relay
        if: steps.vars.outputs.rollback != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-games/sanctuarys-end/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.sanctuary_image }}
          cache-from: type=gha,scope=sanctuary-relay
          cache-to: type=gha,mode=max,scope=sanctuary-relay

      - name: Build and push WebRTC gateway
        if: steps.vars.outputs.rollback != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-games/webrtc-gateway/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.webrtc_image }}
          cache-from: type=gha,scope=webrtc-gateway
          cache-to: type=gha,mode=max,scope=webrtc-gateway

      - name: Build and push Card room
        if: steps.vars.outputs.rollback != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-games/card-room/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.card_image }}
          cache-from: type=gha,scope=card-room
          cache-to: type=gha,mode=max,scope=card-room

      - name: Build and push Gobang
        if: steps.vars.outputs.rollback != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-games/gobang/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.gobang_image }}
          cache-from: type=gha,scope=gobang
          cache-to: type=gha,mode=max,scope=gobang

      # ------------------------------------------------------------------
      # 生成生产 .env
      # ------------------------------------------------------------------
      # 校验与拼装都在 server-games/scripts/generate-env.mjs 里，由它自己的
      # 单元测试覆盖（server-games/scripts/generate-env.test.mjs）。
      # 输出写到 $RUNNER_TEMP（checkout 目录之外），不会被任何步骤打进产物或提交；
      # 脚本只打印键名，绝不打印值；任何一项不合法就直接失败，不生成残缺配置。
      - name: Generate server-games production .env
        id: env
        shell: bash
        env:
          # 非敏感：GitHub Variables
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          TURN_PUBLIC_HOST: ${{ vars.TURN_PUBLIC_HOST }}
          TURN_EXTERNAL_IP: ${{ vars.TURN_EXTERNAL_IP }}
          TURN_REALM: ${{ vars.TURN_REALM }}
          TURN_PORT: ${{ vars.TURN_PORT }}
          TURN_MIN_PORT: ${{ vars.TURN_MIN_PORT }}
          TURN_MAX_PORT: ${{ vars.TURN_MAX_PORT }}
          TURN_CREDENTIAL_TTL_SECONDS: ${{ vars.TURN_CREDENTIAL_TTL_SECONDS }}
          # 敏感：GitHub Secrets
          TURN_SHARED_SECRET: ${{ secrets.TURN_SHARED_SECRET }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/server-games.env"
          node server-games/scripts/generate-env.mjs "$file"
          chmod 600 "$file"
          sha="$(sha256sum "$file" | cut -d' ' -f1)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo ".env 校验和：$sha"

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      # ------------------------------------------------------------------
      # 上传 compose 与 .env：先写临时文件，再在同一文件系统内 mv 原子替换，
      # 避免 compose 读到写了一半的配置。
      # ------------------------------------------------------------------
      - name: Upload compose file and .env (atomic replace)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ENV_FILE: ${{ steps.env.outputs.file }}
          ENV_SHA256: ${{ steps.env.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="/opt/yuqing-game-hall/server-games"
          target="${VPS_USER}@${VPS_HOST}"

          ssh "$target" "mkdir -p '${remote_dir}'"
          scp server-games/docker-compose.prod.yml "${target}:${remote_dir}/docker-compose.prod.yml.incoming"
          scp server-games/scripts/prune-deployed-images.sh "${target}:${remote_dir}/prune-deployed-images.sh.incoming"
          scp "$ENV_FILE" "${target}:${remote_dir}/.env.incoming"

          ssh "$target" "
            set -e
            cd '${remote_dir}'
            chmod 600 .env.incoming
            mv -f .env.incoming .env
            mv -f docker-compose.prod.yml.incoming docker-compose.prod.yml
            mv -f prune-deployed-images.sh.incoming prune-deployed-images.sh
            chmod 700 prune-deployed-images.sh
          "

          # 校验落盘结果与本地生成的一致（能同时验证传输完整性与原子替换是否生效）
          remote_sha="$(ssh "$target" "sha256sum '${remote_dir}/.env' | cut -d' ' -f1")"
          if [ "$remote_sha" != "$ENV_SHA256" ]; then
            printf '::error title=.env 校验失败::本地 sha256=%s，VPS sha256=%s\n' "$ENV_SHA256" "$remote_sha"
            exit 1
          fi
          echo "VPS 上的 .env 已更新并通过校验（sha256=${ENV_SHA256}）"

      - name: Login VPS to GHCR
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        shell: bash
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | \
            ssh "${VPS_USER}@${VPS_HOST}" \
            "docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin"

      - name: Read previous deployed version
        id: previous
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          previous_sha="$(ssh "${VPS_USER}@${VPS_HOST}" \
            "cat /opt/yuqing-game-hall/server-games/.deployed-version 2>/dev/null || true" | tr -d '\r\n')"
          if [[ -n "$previous_sha" && ! "$previous_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::VPS 上的 .deployed-version 无效，将只保留本次版本。"
            previous_sha=""
          fi
          echo "previous_sha=${previous_sha}" >> "$GITHUB_OUTPUT"

      - name: Pull and restart backends
        id: deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          FRUIT_IMAGE: ${{ steps.vars.outputs.fruit_image }}
          SANCTUARY_IMAGE: ${{ steps.vars.outputs.sanctuary_image }}
          WEBRTC_IMAGE: ${{ steps.vars.outputs.webrtc_image }}
          CARD_IMAGE: ${{ steps.vars.outputs.card_image }}
          GOBANG_IMAGE: ${{ steps.vars.outputs.gobang_image }}
        shell: bash
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" \
            "cd /opt/yuqing-game-hall/server-games && \
             FRUIT_PARTY_IMAGE='${FRUIT_IMAGE}' \
             SANCTUARY_RELAY_IMAGE='${SANCTUARY_IMAGE}' \
             WEBRTC_GATEWAY_IMAGE='${WEBRTC_IMAGE}' \
             CARD_ROOM_IMAGE='${CARD_IMAGE}' \
             GOBANG_IMAGE='${GOBANG_IMAGE}' \
             docker compose --env-file .env -f docker-compose.prod.yml pull && \
             FRUIT_PARTY_IMAGE='${FRUIT_IMAGE}' \
             SANCTUARY_RELAY_IMAGE='${SANCTUARY_IMAGE}' \
             WEBRTC_GATEWAY_IMAGE='${WEBRTC_IMAGE}' \
             CARD_ROOM_IMAGE='${CARD_IMAGE}' \
             GOBANG_IMAGE='${GOBANG_IMAGE}' \
             docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans"

      - name: Verify backend health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" \
            "curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://127.0.0.1:8790/api/health && \
             curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://127.0.0.1:8787/health && \
             curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://127.0.0.1:9000/health && \
             curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://127.0.0.1:8002/health && \
             curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://127.0.0.1:8792/health"

      - name: Verify container health states
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          # 必须与 “Pull and restart backends” 传入完全相同的五个镜像变量。
          # docker-compose.prod.yml 里五个镜像用的是 ${VAR:?} 必填语法，
          # compose 在「解析配置」阶段就会校验，缺一个就直接报错退出——
          # 所以本步骤内每一次 docker compose 调用（含循环里的 ps 和最后的 ps）
          # 都必须能读到它们。
          FRUIT_IMAGE: ${{ steps.vars.outputs.fruit_image }}
          SANCTUARY_IMAGE: ${{ steps.vars.outputs.sanctuary_image }}
          WEBRTC_IMAGE: ${{ steps.vars.outputs.webrtc_image }}
          CARD_IMAGE: ${{ steps.vars.outputs.card_image }}
          GOBANG_IMAGE: ${{ steps.vars.outputs.gobang_image }}
        shell: bash
        run: |
          # “进程活着”不等于“服务可用”：这里额外要求 compose 自己的健康检查通过。
          # coturn 使用 host 网络，它的 healthcheck 会在容器里向 127.0.0.1:3478 发 STUN。
          # 镜像变量用 export 而不是普通赋值：docker compose 是外部进程，
          # 只有导出的变量才会进入它的环境；export 一次即可覆盖本步骤内全部 compose 调用。
          ssh "${VPS_USER}@${VPS_HOST}" \
            "cd /opt/yuqing-game-hall/server-games && \
             export FRUIT_PARTY_IMAGE='${FRUIT_IMAGE}' && \
             export SANCTUARY_RELAY_IMAGE='${SANCTUARY_IMAGE}' && \
             export WEBRTC_GATEWAY_IMAGE='${WEBRTC_IMAGE}' && \
             export CARD_ROOM_IMAGE='${CARD_IMAGE}' && \
             export GOBANG_IMAGE='${GOBANG_IMAGE}' && \
             for i in \$(seq 1 20); do \
               status=\$(docker compose --env-file .env -f docker-compose.prod.yml ps --format '{{.Service}}={{.Health}}' | sort); \
               if ! echo \"\$status\" | grep -qvE '=(healthy|running)\$'; then echo \"\$status\"; exit 0; fi; \
               sleep 6; \
             done; \
             echo '容器健康检查未通过：'; docker compose --env-file .env -f docker-compose.prod.yml ps; exit 1"

      - name: Install backend test dependencies
        run: |
          # 只装协议 smoke test 需要的后端工作区，不拖上整个前端依赖树。
          pnpm install --frozen-lockfile \
            --filter @yuqing/sanctuary-relay \
            --filter @yuqing/webrtc-gateway \
            --filter @yuqing/card-room \
            --filter @yuqing/gobang-server

      - name: Test the .env generator
        run: |
          # 生成逻辑本身也要有测试：配置有问题时必须失败并说清是哪一项。
          node --test server-games/scripts/generate-env.test.mjs

      - name: Test image retention rules
        run: node --test server-games/scripts/image-retention.test.mjs

      - name: Read the allowed browser Origin from the VPS
        id: allowed
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          # 直接从 VPS 上刚落盘的 .env 读，顺便验证生成结果真的被服务用上了；
          # 也就不必为了 smoke test 再新增一个 GitHub Secret。
          origin=$(ssh "${VPS_USER}@${VPS_HOST}" \
            "grep -E '^ALLOWED_ORIGINS=' /opt/yuqing-game-hall/server-games/.env | cut -d= -f2- | cut -d, -f1 | tr -d '\"'")
          if [ -z "$origin" ]; then
            echo "::error::VPS 的 server-games/.env 里没有 ALLOWED_ORIGINS，无法做协议验收。"
            exit 1
          fi
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      - name: Open SSH tunnels to the loopback-only backends
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          # 后端只绑定 VPS 的 127.0.0.1，CI 通过隧道访问，不需要对外暴露端口。
          ssh -f -N -o ExitOnForwardFailure=yes \
            -L 18787:127.0.0.1:8787 \
            -L 19000:127.0.0.1:9000 \
            -L 18002:127.0.0.1:8002 \
            -L 18792:127.0.0.1:8792 \
            "${VPS_USER}@${VPS_HOST}"
          for port in 18787 19000 18002 18792; do
            for i in $(seq 1 15); do
              if (echo > "/dev/tcp/127.0.0.1/${port}") >/dev/null 2>&1; then break; fi
              sleep 1
            done
          done

      - name: Protocol smoke test — Sanctuary relay
        env:
          RELAY_URL: ws://127.0.0.1:18787/socket
          RELAY_ORIGIN: ${{ steps.allowed.outputs.origin }}
        run: |
          # 两个真实 WebSocket 客户端：welcome / state / chat / leave 全链路。
          pnpm --dir server-games/sanctuarys-end test

      - name: Protocol smoke test — WebRTC gateway
        env:
          WEBRTC_GATEWAY_URL: http://127.0.0.1:19000
          WEBRTC_GATEWAY_ORIGIN: ${{ steps.allowed.outputs.origin }}
        run: |
          # /health、/rtc-config（自建 STUN + 短期 TURN 凭据）、/peerjs/id 与 Origin 拒绝。
          pnpm --dir server-games/webrtc-gateway test:smoke

      - name: Protocol smoke test — Card room
        env:
          CARD_ROOM_URL: http://127.0.0.1:18002
          BOARD_ORIGIN: ${{ steps.allowed.outputs.origin }}
        run: pnpm --dir server-games/card-room test:smoke

      - name: Protocol smoke test — Gobang
        env:
          GOBANG_URL: ws://127.0.0.1:18792/socket
          BOARD_ORIGIN: ${{ steps.allowed.outputs.origin }}
        run: pnpm --dir server-games/gobang test

      - name: Check public STUN/TURN reachability
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          # 从 runner 直接打 VPS 的 3478/udp，验证防火墙 + coturn + DNS 是否真的通了。
          # 这一步依赖手动配置的 DNS 与防火墙规则，所以失败只警告、不阻断部署。
          turn_ip=$(ssh "${VPS_USER}@${VPS_HOST}" \
            "grep -E '^TURN_EXTERNAL_IP=' /opt/yuqing-game-hall/server-games/.env | cut -d= -f2-")
          turn_port=$(ssh "${VPS_USER}@${VPS_HOST}" \
            "grep -E '^TURN_PORT=' /opt/yuqing-game-hall/server-games/.env | cut -d= -f2-")
          if [ -z "$turn_ip" ]; then
            echo "::warning::VPS .env 里没有 TURN_EXTERNAL_IP，跳过公网 STUN/TURN 检查。"
            exit 0
          fi
          if ! node server-games/scripts/check-turn.mjs "$turn_ip" "${turn_port:-3478}"; then
            echo "::warning::自建 STUN/TURN 从公网不可达：请确认 DNS 指向 $turn_ip，并在 VPS 防火墙放行 UDP/TCP 3478 与中继端口段。"
          fi

      - name: Record deployed version
        if: success()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_SHA: ${{ steps.vars.outputs.image_sha }}
        shell: bash
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" \
            "printf '%s\\n' '${IMAGE_SHA}' > /opt/yuqing-game-hall/server-games/.deployed-version.incoming && \
             mv -f /opt/yuqing-game-hall/server-games/.deployed-version.incoming /opt/yuqing-game-hall/server-games/.deployed-version"

      - name: Keep current and previous backend images
        if: always() && steps.deploy.outcome == 'success'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_PREFIX: ${{ steps.vars.outputs.image_prefix }}
          IMAGE_SHA: ${{ steps.vars.outputs.image_sha }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.previous_sha }}
        shell: bash
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" \
            "bash /opt/yuqing-game-hall/server-games/prune-deployed-images.sh \
              '${IMAGE_PREFIX}' '${IMAGE_SHA}' '${PREVIOUS_SHA}'"

      # 迁移期间香港和马来西亚共用 GHCR 镜像仓库。
      # 暂停全局 GHCR 版本删除，避免一台机器的部署删掉另一台机器正在使用的镜像。
      # 单台 VPS 上的镜像保留/清理逻辑不受影响。香港退役后可恢复全局清理。
      - name: Keep current and previous GHCR versions
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_SHA: ${{ steps.vars.outputs.image_sha }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.previous_sha }}
        run: |
          if ! bash server-games/scripts/prune-ghcr-versions.sh \
            "$IMAGE_SHA" "$PREVIOUS_SHA"; then
            echo "::warning::GHCR 旧版本未能自动清理；VPS 部署已完成，请检查容器包权限并手动清理旧版本。"
          fi

      # 放在最后：它必须在上传步骤之后执行，否则会把还没上传的 .env 删掉。
      - name: Discard generated .env
        if: always()
        shell: bash
        run: |
          # 无论成功失败都清掉 runner 上的临时 .env。
          rm -f "$RUNNER_TEMP/server-games.env"
