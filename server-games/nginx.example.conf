map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 这里只反向代理果切 API/WSS，不提供任何游戏静态文件。
server {
    listen 443 ssl http2;
    server_name rooms.example.com;
    ssl_certificate /etc/letsencrypt/live/rooms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rooms.example.com/privkey.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }
}

# 这里只反向代理 Sanctuary 的位置/聊天 WebSocket 中继。
server {
    listen 443 ssl http2;
    server_name sanctuary.example.com;
    ssl_certificate /etc/letsencrypt/live/sanctuary.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanctuary.example.com/privkey.pem;

    location = /socket {
        proxy_pass http://127.0.0.1:8787/socket;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }
}

# 雨晴自建 WebRTC 基础设施：PeerJS 信令（HTTP + WebSocket）与 TURN 临时凭据。
#
# 注意：这个 server 必须占用整站根路径，不能用 location 前缀转发。
# PeerJS 客户端会把 `path` 拼成 `<path>peerjs/id` 与 `<path>peerjs`，
# gateway 自身的 /rtc-config 与 /health 也在根路径上。
#
# STUN/TURN（3478 tcp+udp 与中继端口段）不经过 Nginx，也不经过 Cloudflare 代理，
# 必须由 VPS 防火墙直接放行到 coturn。
server {
    listen 443 ssl http2;
    server_name rtc.example.com;
    ssl_certificate /etc/letsencrypt/live/rtc.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtc.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 信令是长连接，不能按默认 60s 掐断。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
