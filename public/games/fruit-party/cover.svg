<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800">
  <defs>
    <radialGradient id="bg" cx="65%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#dd5037" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#3b1610"/>
      <stop offset="100%" stop-color="#140705"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a59" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#dd5037" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>
  
  <!-- Subtle geometric grid -->
  <path d="M0 160H1280M0 320H1280M0 480H1280M0 640H1280M256 0V800M512 0V800M768 0V800M1024 0V800" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04"/>
  <circle cx="820" cy="400" r="340" fill="url(#glow)"/>

  <!-- Blade Slash Trail -->
  <path d="M480 680 Q760 380 1180 140" fill="none" stroke="url(#blade)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <path d="M500 660 Q770 390 1160 160" fill="none" stroke="#fff" stroke-width="2" opacity="0.9"/>
  <!-- Sparks -->
  <circle cx="780" cy="370" r="6" fill="#fff"/>
  <circle cx="830" cy="330" r="4" fill="#67e8f9"/>
  <circle cx="730" cy="420" r="5" fill="#fde047"/>
  <circle cx="920" cy="270" r="7" fill="#fff"/>

  <!-- Watermelon slice (top right) -->
  <g transform="translate(760, 160) rotate(-18)" filter="url(#shadow)">
    <!-- Rind -->
    <path d="M 0 0 A 180 180 0 0 0 340 60 Z" fill="#2d7a3d" stroke="#1b4d26" stroke-width="4"/>
    <path d="M 12 12 A 165 165 0 0 0 326 66 Z" fill="#84cc16"/>
    <path d="M 22 22 A 152 152 0 0 0 314 74 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Flesh -->
    <path d="M 28 28 A 144 144 0 0 0 306 80 Z" fill="#ef4444"/>
    <!-- Seeds -->
    <ellipse cx="90" cy="80" rx="6" ry="11" fill="#18181b" transform="rotate(25 90 80)"/>
    <ellipse cx="140" cy="95" rx="6" ry="11" fill="#18181b" transform="rotate(10 140 95)"/>
    <ellipse cx="195" cy="100" rx="6" ry="11" fill="#18181b" transform="rotate(-10 195 100)"/>
    <ellipse cx="250" cy="90" rx="6" ry="11" fill="#18181b" transform="rotate(-25 250 90)"/>
  </g>

  <!-- Orange (lower right) -->
  <g transform="translate(860, 420)" filter="url(#shadow)">
    <circle cx="110" cy="110" r="105" fill="#f97316"/>
    <circle cx="110" cy="110" r="92" fill="#fb923c"/>
    <!-- Highlight -->
    <path d="M 45 65 A 80 80 0 0 1 120 30" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
    <!-- Leaf -->
    <path d="M 110 5 C 130 -30 170 -20 175 5 C 155 40 115 30 110 5 Z" fill="#22c55e"/>
  </g>

  <!-- Kiwi Slice (floating center) -->
  <g transform="translate(620, 440) rotate(15)" filter="url(#shadow)">
    <circle cx="70" cy="70" r="65" fill="#65a30d"/>
    <circle cx="70" cy="70" r="58" fill="#84cc16"/>
    <circle cx="70" cy="70" r="22" fill="#f7fee7"/>
    <!-- Seeds circle -->
    <circle cx="70" cy="40" r="3" fill="#18181b"/>
    <circle cx="92" cy="48" r="3" fill="#18181b"/>
    <circle cx="100" cy="70" r="3" fill="#18181b"/>
    <circle cx="92" cy="92" r="3" fill="#18181b"/>
    <circle cx="70" cy="100" r="3" fill="#18181b"/>
    <circle cx="48" cy="92" r="3" fill="#18181b"/>
    <circle cx="40" cy="70" r="3" fill="#18181b"/>
    <circle cx="48" cy="48" r="3" fill="#18181b"/>
  </g>

  <!-- Left Content Box -->
  <g transform="translate(100, 150)">
    <!-- Badge -->
    <rect width="180" height="36" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>
    <text x="90" y="23" text-anchor="middle" fill="#fecaca" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" letter-spacing="2">ARCADE EDITION</text>

    <!-- Subtitle -->
    <text x="0" y="110" fill="#fca5a5" font-family="'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" letter-spacing="4">短局动作与好友对战</text>

    <!-- Main Title -->
    <text x="0" y="240" fill="#ffffff" font-family="'Microsoft YaHei', sans-serif" font-size="92" font-weight="900" letter-spacing="-2">果切派对</text>
    <text x="4" y="300" fill="rgba(255,255,255,0.35)" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="800" letter-spacing="6">FRUIT PARTY</text>

    <!-- Tagline -->
    <text x="0" y="380" fill="#e2e8f0" font-family="'Microsoft YaHei', sans-serif" font-size="22" font-weight="500">切开飞舞的水果，和朋友来一场爽快对决。</text>

    <!-- Pills -->
    <g transform="translate(0, 430)">
      <rect width="84" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="42" y="23" text-anchor="middle" fill="#cbd5e1" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">单人</text>

      <rect x="96" width="84" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="138" y="23" text-anchor="middle" fill="#cbd5e1" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">1v1</text>

      <rect x="192" width="84" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="234" y="23" text-anchor="middle" fill="#cbd5e1" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">街机</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1232" height="752" rx="20" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
</svg>