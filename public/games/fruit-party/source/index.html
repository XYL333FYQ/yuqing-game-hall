<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./assets/fruits/watermelon.svg" type="image/svg+xml" />
    <title>果切派对</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #17100e; color: #fff8f0; }
      * { box-sizing: border-box; } html, body, #fruit-party { margin: 0; min-height: 100%; width: 100%; } body { background: radial-gradient(circle at 50% 0%, #4a2117, #17100e 70%); }
      .fruit-game { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; } .toolbar { height: 64px; display: flex; align-items: center; gap: 20px; padding: 0 24px; background: #231411; border-bottom: 1px solid #633126; } .brand { color: inherit; text-decoration: none; font-size: 18px; } .mode-switch { display: flex; gap: 6px; margin: auto; } button { border: 1px solid #754033; border-radius: 999px; padding: 8px 14px; color: inherit; background: #351b16; cursor: pointer; } button.active, button.start { background: #dd5037; border-color: #dd5037; } .tools { display: flex; gap: 8px; }
      .stage { position: relative; min-height: calc(100vh - 64px); overflow: hidden; } .game-canvas { display: block; width: 100%; height: 100%; touch-action: none; } .overlay, .result { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; padding: 28px; background: linear-gradient(180deg, #231411c9, #231411e8); } .overlay[hidden], .result[hidden] { display: none; } .overlay h1, .result h2 { margin: 8px 0 12px; font-size: clamp(32px, 6vw, 64px); line-height: 1.08; } .overlay p { max-width: 560px; color: #e7cfc4; line-height: 1.7; } .eyebrow { color: #f9ae8f; letter-spacing: .12em; text-transform: uppercase; } .start { font-size: 18px; padding: 12px 24px; } .hint { position: absolute; bottom: 14px; width: 100%; text-align: center; color: #d9b4a6; font-size: 13px; pointer-events: none; }
      @media (max-width: 720px) { .toolbar { padding: 0 12px; gap: 8px; } .brand strong { display: none; } .tools button { padding: 7px 9px; font-size: 12px; } .mode-switch button { padding: 7px 9px; font-size: 12px; } }
    </style>
  </head>
  <body><div id="game-root"></div><script vite-ignore src="./fruit-party.config.js"></script><script type="module" src="./main.ts"></script></body>
</html>
