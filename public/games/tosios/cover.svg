<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800">
  <defs>
    <radialGradient id="bg" cx="65%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#5a1e0d"/>
      <stop offset="100%" stop-color="#1c0a05"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Background Grid & Arena Markings -->
  <path d="M0 160H1280M0 320H1280M0 480H1280M0 640H1280M256 0V800M512 0V800M768 0V800M1024 0V800" stroke="#f97316" stroke-width="1" stroke-opacity="0.06"/>
  <circle cx="880" cy="400" r="320" fill="url(#glow)"/>

  <!-- Arena Duel / Crosshair Graphics (Right Side) -->
  <g transform="translate(880, 400)" filter="url(#shadow)">
    <!-- Arena Ring -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="#ea580c" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="12 8"/>
    <circle cx="0" cy="0" r="100" fill="rgba(249,115,22,0.1)" stroke="#f97316" stroke-width="2"/>

    <!-- Red vs Blue Duel Energy Clash -->
    <!-- Red Champion (Left) -->
    <g transform="translate(-80, -20)">
      <circle cx="0" cy="0" r="38" fill="#ef4444" stroke="#b91c1c" stroke-width="4"/>
      <!-- Gun Barrel & Muzzle Flash -->
      <rect x="25" y="-7" width="40" height="14" rx="4" fill="#334155"/>
      <polygon points="65,-12 85,0 65,12 70,0" fill="#fde047"/>
      <circle cx="0" cy="0" r="18" fill="#fca5a5"/>
    </g>

    <!-- Blue Champion (Right) -->
    <g transform="translate(80, 20)">
      <circle cx="0" cy="0" r="38" fill="#3b82f6" stroke="#1d4ed8" stroke-width="4"/>
      <!-- Gun Barrel & Muzzle Flash -->
      <rect x="-65" y="-7" width="40" height="14" rx="4" fill="#334155"/>
      <polygon points="-65,-12 -85,0 -65,12 -70,0" fill="#67e8f9"/>
      <circle cx="0" cy="0" r="18" fill="#bfdbfe"/>
    </g>

    <!-- Center Bullet Clash Spark -->
    <circle cx="0" cy="0" r="16" fill="#ffffff"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#fde047" stroke-width="4" opacity="0.8"/>
    <line x1="-35" y1="-35" x2="35" y2="35" stroke="#ffffff" stroke-width="3"/>
    <line x1="35" y1="-35" x2="-35" y2="35" stroke="#ffffff" stroke-width="3"/>

    <!-- Crosshair Target -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="0" y1="-80" x2="0" y2="-40" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="40" x2="0" y2="80" stroke="#ffffff" stroke-width="2"/>
    <line x1="-80" y1="0" x2="-40" y2="0" stroke="#ffffff" stroke-width="2"/>
    <line x1="40" y1="0" x2="80" y2="0" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Left Content Box -->
  <g transform="translate(100, 150)">
    <!-- Badge -->
    <rect width="180" height="36" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>
    <text x="90" y="23" text-anchor="middle" fill="#fed7aa" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" letter-spacing="2">ARCADE EDITION</text>

    <!-- Subtitle -->
    <text x="0" y="110" fill="#fdba74" font-family="'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" letter-spacing="4">多人 2D 竞技射击</text>

    <!-- Main Title -->
    <text x="0" y="240" fill="#ffffff" font-family="'Microsoft YaHei', sans-serif" font-size="92" font-weight="900" letter-spacing="-2">双队乱斗</text>
    <text x="4" y="300" fill="rgba(255,255,255,0.35)" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="800" letter-spacing="6">TOSIOS ARENA</text>

    <!-- Tagline -->
    <text x="0" y="380" fill="#e2e8f0" font-family="'Microsoft YaHei', sans-serif" font-size="22" font-weight="500">在紧凑地图中组队交锋，抢下属于你的胜利。</text>

    <!-- Pills -->
    <g transform="translate(0, 430)">
      <rect width="84" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="42" y="23" text-anchor="middle" fill="#cbd5e1" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">多人</text>

      <rect x="96" width="84" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="138" y="23" text-anchor="middle" fill="#cbd5e1" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">团队</text>

      <rect x="192" width="84" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="234" y="23" text-anchor="middle" fill="#cbd5e1" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">射击</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1232" height="752" rx="20" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
</svg>