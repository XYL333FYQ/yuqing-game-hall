<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800">
  <defs>
    <radialGradient id="bg" cx="65%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#051f11"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Tactical Radar & Map Grid -->
  <path d="M0 160H1280M0 320H1280M0 480H1280M0 640H1280M256 0V800M512 0V800M768 0V800M1024 0V800" stroke="#4ade80" stroke-width="1" stroke-opacity="0.06"/>
  
  <!-- Radar circles on right -->
  <circle cx="880" cy="400" r="320" fill="url(#glow)"/>
  <circle cx="880" cy="400" r="260" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8"/>
  <circle cx="880" cy="400" r="180" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="880" cy="400" r="90" fill="none" stroke="#4ade80" stroke-width="3" stroke-opacity="0.5"/>
  <!-- Radar sweep line -->
  <line x1="880" y1="400" x2="1100" y2="240" stroke="#86efac" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Tactical Top-down player & loot icons (Right Side) -->
  <g transform="translate(880, 400)" filter="url(#shadow)">
    <!-- Safe zone circle -->
    <circle cx="0" cy="0" r="140" fill="rgba(34,197,94,0.12)" stroke="#4ade80" stroke-width="4"/>
    
    <!-- Player circle with hands/gun -->
    <g transform="translate(20, -10)">
      <circle cx="0" cy="0" r="32" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
      <!-- Hands / Gun -->
      <rect x="20" y="-8" width="46" height="16" rx="4" fill="#1e293b"/>
      <circle cx="16" cy="-18" r="10" fill="#facc15"/>
      <circle cx="16" cy="18" r="10" fill="#facc15"/>
    </g>

    <!-- Supply Crate -->
    <g transform="translate(-80, 40)">
      <rect width="64" height="64" rx="10" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
      <!-- Parachute cross -->
      <path d="M0 32H64M32 0V64" stroke="#ffffff" stroke-width="6"/>
      <circle cx="32" cy="32" r="8" fill="#fef08a"/>
    </g>

    <!-- Enemy blip -->
    <circle cx="-60" cy="-70" r="12" fill="#ef4444" opacity="0.9"/>
    <circle cx="-60" cy="-70" r="22" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Left Content Box -->
  <g transform="translate(100, 150)">
    <!-- Badge -->
    <rect width="180" height="36" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>
    <text x="90" y="23" text-anchor="middle" fill="#bbf7d0" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" letter-spacing="2">ARCADE EDITION</text>

    <!-- Subtitle -->
    <text x="0" y="110" fill="#86efac" font-family="'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" letter-spacing="4">多人俯视角生存竞技</text>

    <!-- Main Title -->
    <text x="0" y="240" fill="#ffffff" font-family="'Microsoft YaHei', sans-serif" font-size="92" font-weight="900" letter-spacing="-2">荒野生存</text>
    <text x="4" y="300" fill="rgba(255,255,255,0.35)" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="800" letter-spacing="6">SUROI SURVIVAL</text>

    <!-- Tagline -->
    <text x="0" y="380" fill="#e2e8f0" font-family="'Microsoft YaHei', sans-serif" font-size="22" font-weight="500">搜集装备、躲避危险，在荒野中成为最后的幸存者。</text>

    <!-- Pills -->
    <g transform="translate(0, 430)">
      <rect width="84" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="42" y="23" text-anchor="middle" fill="#cbd5e1" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">多人</text>

      <rect x="96" width="84" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="138" y="23" text-anchor="middle" fill="#cbd5e1" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">生存</text>

      <rect x="192" width="84" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="234" y="23" text-anchor="middle" fill="#cbd5e1" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">射击</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1232" height="752" rx="20" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
</svg>