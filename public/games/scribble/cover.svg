<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800">
  <defs>
    <radialGradient id="bg" cx="65%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#0f3b60"/>
      <stop offset="100%" stop-color="#051524"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Background Grid -->
  <path d="M0 160H1280M0 320H1280M0 480H1280M0 640H1280M256 0V800M512 0V800M768 0V800M1024 0V800" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.06"/>
  <circle cx="880" cy="400" r="320" fill="url(#glow)"/>

  <!-- Right Visual: Easel, Palette, Brush stroke, Doodle -->
  <g transform="translate(860, 390)" filter="url(#shadow)">
    <!-- Easel Canvas Stand -->
    <rect x="-140" y="-150" width="280" height="200" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect x="-120" y="-130" width="240" height="160" rx="8" fill="#0f172a"/>

    <!-- Doodle smile inside canvas -->
    <path d="M-60 -60 Q-40 -90 -20 -60" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 -60 Q40 -90 60 -60" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
    <path d="M-50 -10 Q0 50 50 -10" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>

    <!-- Glowing Brush and Dynamic Stroke -->
    <path d="M-180 80 Q-60 140 160 40" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <path d="M-170 85 Q-60 140 140 45" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>

    <!-- Painter's Palette (lower left of stand) -->
    <g transform="translate(-110, 80) rotate(-15)">
      <ellipse cx="0" cy="0" rx="65" ry="45" fill="#ca8a04" stroke="#a16207" stroke-width="3"/>
      <circle cx="35" cy="10" r="14" fill="#051524"/> <!-- thumb hole -->
      <!-- Paint blobs -->
      <circle cx="-35" cy="-15" r="9" fill="#ef4444"/>
      <circle cx="-15" cy="-25" r="9" fill="#3b82f6"/>
      <circle cx="10" cy="-25" r="9" fill="#22c55e"/>
      <circle cx="-40" cy="15" r="9" fill="#a855f7"/>
      <circle cx="-15" cy="20" r="9" fill="#facc15"/>
    </g>

    <!-- Floating Brush -->
    <g transform="translate(140, 20) rotate(45)">
      <rect x="-8" y="-70" width="16" height="80" rx="4" fill="#d97706"/>
      <rect x="-10" y="10" width="20" height="24" fill="#94a3b8"/>
      <path d="M-10 34 C-10 50 10 50 10 34 Z" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Left Content Box -->
  <g transform="translate(100, 150)">
    <!-- Badge -->
    <rect width="180" height="36" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>
    <text x="90" y="23" text-anchor="middle" fill="#bae6fd" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" letter-spacing="2">ARCADE EDITION</text>

    <!-- Subtitle -->
    <text x="0" y="110" fill="#7dd3fc" font-family="'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" letter-spacing="4">多人派对猜词</text>

    <!-- Main Title -->
    <text x="0" y="240" fill="#ffffff" font-family="'Microsoft YaHei', sans-serif" font-size="92" font-weight="900" letter-spacing="-2">你画我猜</text>
    <text x="4" y="300" fill="rgba(255,255,255,0.35)" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="800" letter-spacing="6">SCRIBBLE PARTY</text>

    <!-- Tagline -->
    <text x="0" y="380" fill="#e2e8f0" font-family="'Microsoft YaHei', sans-serif" font-size="22" font-weight="500">轮流画画和猜词，把一群人的笑声聚到一起。</text>

    <!-- Pills -->
    <g transform="translate(0, 430)">
      <rect width="84" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="42" y="23" text-anchor="middle" fill="#cbd5e1" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">多人</text>

      <rect x="96" width="84" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="138" y="23" text-anchor="middle" fill="#cbd5e1" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">派对</text>

      <rect x="192" width="84" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="234" y="23" text-anchor="middle" fill="#cbd5e1" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">创作</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1232" height="752" rx="20" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
</svg>