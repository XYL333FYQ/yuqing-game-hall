<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800">
  <defs>
    <radialGradient id="bg" cx="65%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#08071a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- World Hexagonal Map Grid -->
  <path d="M0 160H1280M0 320H1280M0 480H1280M0 640H1280M256 0V800M512 0V800M768 0V800M1024 0V800" stroke="#6366f1" stroke-width="1" stroke-opacity="0.06"/>
  <circle cx="880" cy="400" r="320" fill="url(#glow)"/>

  <!-- Tactical Hexagons & Global Command Nodes (Right Side) -->
  <g transform="translate(860, 400)" filter="url(#shadow)">
    <!-- Global Territory Circle Outline -->
    <circle cx="0" cy="0" r="190" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 6"/>

    <!-- Central Hexagon Base -->
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="#4338ca" stroke="#818cf8" stroke-width="4"/>
    <polygon points="0,-45 38,-22 38,22 0,45 -38,22 -38,-22" fill="#6366f1"/>
    <!-- Capital Star -->
    <circle cx="0" cy="0" r="14" fill="#facc15"/>

    <!-- Surrounding Hexagons -->
    <!-- Top Right (Captured - Cyan) -->
    <g transform="translate(105, -60)">
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="#0891b2" stroke="#67e8f9" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#cffafe"/>
    </g>

    <!-- Bottom Right (Contested - Rose) -->
    <g transform="translate(105, 60)">
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="#be123c" stroke="#fb7185" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#ffe4e6"/>
    </g>

    <!-- Top Left (Allied - Emerald) -->
    <g transform="translate(-105, -60)">
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="#047857" stroke="#34d399" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#d1fae5"/>
    </g>

    <!-- Bottom Left (Neutral) -->
    <g transform="translate(-105, 60)">
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="#334155" stroke="#94a3b8" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="#e2e8f0"/>
    </g>

    <!-- Tactical Connecting Lines & Arrows -->
    <line x1="0" y1="0" x2="105" y2="-60" stroke="#a5b4fc" stroke-width="3" stroke-dasharray="4 4"/>
    <line x1="0" y1="0" x2="-105" y2="-60" stroke="#a5b4fc" stroke-width="3" stroke-dasharray="4 4"/>
    <line x1="0" y1="0" x2="105" y2="60" stroke="#fb7185" stroke-width="3" stroke-dasharray="4 4"/>
  </g>

  <!-- Left Content Box -->
  <g transform="translate(100, 150)">
    <!-- Badge -->
    <rect width="180" height="36" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>
    <text x="90" y="23" text-anchor="middle" fill="#c7d2fe" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" letter-spacing="2">ARCADE EDITION</text>

    <!-- Subtitle -->
    <text x="0" y="110" fill="#a5b4fc" font-family="'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" letter-spacing="4">大规模多人领土策略</text>

    <!-- Main Title -->
    <text x="0" y="240" fill="#ffffff" font-family="'Microsoft YaHei', sans-serif" font-size="92" font-weight="900" letter-spacing="-2">世界前线</text>
    <text x="4" y="300" fill="rgba(255,255,255,0.35)" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="800" letter-spacing="6">OPENFRONT IO</text>

    <!-- Tagline -->
    <text x="0" y="380" fill="#e2e8f0" font-family="'Microsoft YaHei', sans-serif" font-size="22" font-weight="500">在世界地图上扩张领地，和大量玩家争夺胜利。</text>

    <!-- Pills -->
    <g transform="translate(0, 430)">
      <rect width="84" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="42" y="23" text-anchor="middle" fill="#cbd5e1" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">多人</text>

      <rect x="96" width="84" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="138" y="23" text-anchor="middle" fill="#cbd5e1" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">策略</text>

      <rect x="192" width="84" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="234" y="23" text-anchor="middle" fill="#cbd5e1" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">大地图</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1232" height="752" rx="20" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
</svg>