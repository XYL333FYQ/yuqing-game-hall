<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090b10" />
    <script src="/platform/theme-init.js"></script>
    <link rel="stylesheet" href="/platform/portal.css" />
    <meta name="description" content="雨晴游戏厅：轻松、好玩、可单机也可与朋友联机的浏览器小游戏。" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>雨晴游戏厅</title>
  </head>
  <body>
    <dialog class="entry-screen" id="entry-screen" open aria-label="正在进入雨晴游戏厅">
      <p class="entry-coordinate" aria-hidden="true">YUQING / ARCADE<span>PARALLEL WORLD 001</span></p>
      <div class="entry-content">
        <div class="entry-orbit" aria-hidden="true">
          <svg class="entry-scenery entry-constellation" viewBox="-40 -40 400 400" fill="none">
            <path d="M-15 92 62 40 122 72 237 16 334 88M10 238 80 286 182 255 272 301 340 236" stroke="#799fba" stroke-opacity=".4"/>
            <g fill="#8ebdca"><circle cx="-15" cy="92" r="3"/><circle cx="62" cy="40" r="2"/><circle cx="122" cy="72" r="3"/><circle cx="334" cy="88" r="2"/><circle cx="10" cy="238" r="2"/><circle cx="182" cy="255" r="2"/><circle cx="340" cy="236" r="3"/></g>
            <g fill="#e7b778"><circle cx="237" cy="16" r="4"/><circle cx="80" cy="286" r="3"/><circle cx="272" cy="301" r="3"/></g>
          </svg>
          <svg class="entry-scenery entry-prism" viewBox="-40 -40 400 400" fill="none">
            <path d="M36 240 123 11 210 87 132 318Z" fill="#8fb9ca" fill-opacity=".19" stroke="#88adbd" stroke-opacity=".65"/>
            <path d="M123 11 286 101 210 290 210 87Z" fill="#9dcbb8" fill-opacity=".24" stroke="#88b9a5" stroke-opacity=".6"/>
            <path d="M36 240 210 87 307 204 132 318Z" fill="#e5ad96" fill-opacity=".16" stroke="#cd9b84" stroke-opacity=".45"/>
            <path d="M123 11 210 87 132 318M36 240 286 101" stroke="#fff" stroke-width="2" stroke-opacity=".9"/>
          </svg>
          <svg class="entry-scenery entry-flower" viewBox="-40 -40 400 400" fill="none">
            <path d="M160 160C91 117 104 10 160 3C219 10 225 117 160 160Z" fill="#dba3bc"/>
            <path d="M160 160C91 117 104 10 160 3C219 10 225 117 160 160Z" transform="rotate(60 160 160)" fill="#a6bdaf"/>
            <path d="M160 160C91 117 104 10 160 3C219 10 225 117 160 160Z" transform="rotate(120 160 160)" fill="#e6bda0"/>
            <path d="M160 160C91 117 104 10 160 3C219 10 225 117 160 160Z" transform="rotate(180 160 160)" fill="#b8afd2"/>
            <path d="M160 160C91 117 104 10 160 3C219 10 225 117 160 160Z" transform="rotate(240 160 160)" fill="#dba3bc"/>
            <path d="M160 160C91 117 104 10 160 3C219 10 225 117 160 160Z" transform="rotate(300 160 160)" fill="#a6bdaf"/>
          </svg>
          <span class="entry-reticle"></span>
          <span class="entry-chassis"></span>
          <span class="entry-satellite entry-satellite-play"><svg viewBox="0 0 40 40" fill="none"><path d="M15 11 29 20 15 29Z" fill="currentColor"/></svg></span>
          <span class="entry-satellite entry-satellite-pad"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="11" width="26" height="20" rx="7"/><path d="M12 21h8m-4-4v8"/><circle cx="26" cy="18" r="1.5" fill="currentColor"/><circle cx="29" cy="23" r="1.5" fill="currentColor"/></svg></span>
          <span class="entry-satellite entry-satellite-star"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m20 7 3.5 9.5L33 20l-9.5 3.5L20 33l-3.5-9.5L7 20l9.5-3.5Z"/></svg></span>
          <span class="entry-mark"><i></i><i></i><i></i></span>
        </div>
        <span class="entry-edition" aria-hidden="true"><span class="entry-edition-dark">NIGHT VOYAGE · 星际航道</span><span class="entry-edition-light">DAYLIGHT PRISM · 日光折射</span><span class="entry-edition-pink">GARDEN PLAY · 花间游园</span></span>
        <p class="entry-wordmark">雨晴游戏厅</p>
        <p class="entry-caption">YUQING ARCADE · ENTER ANOTHER WORLD</p>
        <p class="entry-status" role="status">正在为你准备下一局</p>
        <span class="entry-scan" aria-hidden="true"></span>
      </div>
      <span class="entry-sector" aria-hidden="true">YOUR NEXT ADVENTURE STARTS HERE</span>
      <form class="entry-skip" method="dialog"><button type="submit">跳过开场 ↗</button></form>
    </dialog>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
